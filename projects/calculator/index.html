<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        
        <input style="grid-area: input" type="text" id="input">
        <button id="num1" onclick="num(1)">1</button>
        <button id="num2" onclick="num(2)">2</button>
        <button id="num3" onclick="num(3)">3</button>
        <button id="num4" onclick="num(4)">4</button>
        <button id="num5" onclick="num(5)">5</button>
        <button id="num6" onclick="num(6)">6</button>
        <button id="num7" onclick="num(7)">7</button>
        <button id="num8" onclick="num(8)">8</button>
        <button id="num9" onclick="num(9)">9</button>
        <button id="num0" onclick="num(0)">0</button>
        <button id="minus" onclick="operator('-')"">-</button>
        <button id="plus" onclick="operator('+')">+</button>
        <button id="times" onclick="operator('x')">x</button>
        <button id="divide"onclick="operator('/')">/</button>
        <button id="equal" onclick="equal()">=</button>

    </div>
    

    <script src="script.js"></script>
</body>
</html>
